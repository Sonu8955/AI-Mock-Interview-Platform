<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>AI Interview</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Poppins,sans-serif;
        }

        body{

            background:
            linear-gradient(135deg,#020617,#0f172a,#111827);

            color:white;

            padding:40px;
        }

        .container{

            max-width:1000px;

            margin:auto;
        }

        h1{

            text-align:center;

            margin-bottom:30px;

            color:#38bdf8;

            font-size:42px;
        }

        .top-bar{

            display:flex;

            justify-content:space-between;

            align-items:center;

            margin-bottom:30px;
        }

        .timer{

            background:#dc2626;

            padding:15px 25px;

            border-radius:15px;

            font-size:22px;

            font-weight:bold;

            box-shadow:
            0 0 15px rgba(220,38,38,0.5);
        }

        .progress-container{

            width:70%;

            height:20px;

            background:#1e293b;

            border-radius:20px;

            overflow:hidden;
        }

        .progress-bar{

            height:100%;

            width:0%;

            background:
            linear-gradient(135deg,#2563eb,#06b6d4);

            transition:0.5s;
        }

        .question-box{

            background:#111827;

            padding:30px;

            border-radius:20px;

            margin-bottom:30px;

            box-shadow:
            0 0 20px rgba(0,0,0,0.4);
        }

        h2{

            margin-bottom:20px;

            color:#22c55e;
        }

        textarea{

            width:100%;

            height:150px;

            padding:20px;

            border:none;

            border-radius:15px;

            background:#1e293b;

            color:white;

            font-size:16px;

            resize:none;
        }

        button{

            width:100%;

            padding:18px;

            border:none;

            border-radius:15px;

            margin-top:30px;

            font-size:20px;

            font-weight:bold;

            color:white;

            cursor:pointer;

            background:
            linear-gradient(135deg,#2563eb,#06b6d4);

            transition:0.3s;
        }

        button:hover{

            transform:scale(1.02);
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>

            🤖 AI Mock Interview

        </h1>

        <div class="top-bar">

            <div class="timer">

                ⏳ Time Left:
                <span id="time">

                    60

                </span>s

            </div>

            <div class="progress-container">

                <div class="progress-bar"
                id="progressBar"></div>

            </div>

        </div>

        <form action="/submit" method="POST">

            {% for question in questions %}

            <div class="question-box">

                <h2>

                    {{loop.index}}.
                    {{question}}

                </h2>

                <textarea

                name="{{question}}"

                placeholder="Write your answer here..."

                required></textarea>

            </div>

            {% endfor %}

            <button type="submit">

                Submit Answers 

            </button>

        </form>

    </div>

    <script>

        let timeLeft = 60;

        const timer = document.getElementById("time");

        const progressBar =
        document.getElementById("progressBar");

        let progress = 0;

        const interval = setInterval(() => {

            timeLeft--;

            timer.innerText = timeLeft;

            progress += 100 / 60;

            progressBar.style.width =
            progress + "%";

            if(timeLeft <= 0){

                clearInterval(interval);

                alert("⏳ Time is over!");

                document.forms[0].submit();
            }

        },1000);

    </script>

</body>

</html>
