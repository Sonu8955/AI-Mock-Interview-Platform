<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Poppins,sans-serif;
        }

        body{

            background:
            linear-gradient(135deg,#020617,#0f172a,#111827);

            color:white;

            padding:40px;
        }

        .container{

            max-width:1000px;

            margin:auto;
        }

        h1{

            text-align:center;

            margin-bottom:40px;

            color:#38bdf8;

            font-size:40px;
        }

        .profile-box{

            background:#111827;

            padding:30px;

            border-radius:20px;

            margin-bottom:40px;

            text-align:center;

            box-shadow:
            0 0 20px rgba(0,0,0,0.4);
        }

        .profile-box h2{

            color:#38bdf8;

            margin-bottom:20px;

            font-size:32px;
        }

        .profile-box p{

            margin-top:12px;

            font-size:20px;

            color:#cbd5e1;
        }

        .card{

            background:#1e293b;

            padding:25px;

            border-radius:20px;

            margin-bottom:25px;

            box-shadow:
            0 0 15px rgba(0,0,0,0.4);

            transition:0.3s;
        }

        .card:hover{

            transform:translateY(-5px);
        }

        .score{

            font-size:32px;

            color:#22c55e;

            font-weight:bold;
        }

        .role{

            font-size:22px;

            margin-top:12px;

            color:#e2e8f0;
        }

        .btn{

            display:block;

            width:100%;

            text-align:center;

            padding:16px;

            margin-top:30px;

            border-radius:15px;

            text-decoration:none;

            color:white;

            font-size:18px;

            font-weight:bold;

            background:
            linear-gradient(135deg,#2563eb,#06b6d4);

            transition:0.3s;
        }

        .btn:hover{

            transform:scale(1.02);
        }

        .logout{

            background:
            linear-gradient(135deg,#dc2626,#ef4444);
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>

            📊 Interview Dashboard

        </h1>

        <div class="profile-box">

            <h2>

                👤 {{username}}

            </h2>

            <p>

                Total Interviews:
                {{total_interviews}}

            </p>

            <p>

                Best Score:
                {{best_score}}%

            </p>

        </div>

        {% for item in scores %}

        <div class="card">

            <div class="score">

                {{item.score}}%

            </div>

            <div class="role">

                Role:
                {{item.role}}

            </div>

        </div>

        {% endfor %}

        <a href="/" class="btn">

             Back To Home

        </a>

        <a href="/logout" class="btn logout">

            🔓 Logout

        </a>

    </div>

</body>

</html>
