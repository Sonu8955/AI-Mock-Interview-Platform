<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Signup</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Poppins,sans-serif;
        }

        body{

            height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            background:
            linear-gradient(135deg,#020617,#0f172a,#111827);
        }

        .box{

            width:400px;

            background:#111827;

            padding:40px;

            border-radius:25px;

            box-shadow:
            0 0 25px rgba(0,0,0,0.5);

            color:white;
        }

        h1{

            text-align:center;

            margin-bottom:30px;

            color:#22c55e;
        }

        input{

            width:100%;

            padding:15px;

            margin-bottom:20px;

            border:none;

            border-radius:12px;

            background:#1e293b;

            color:white;

            font-size:16px;
        }

        button{

            width:100%;

            padding:15px;

            border:none;

            border-radius:12px;

            background:
            linear-gradient(135deg,#16a34a,#22c55e);

            color:white;

            font-size:18px;

            cursor:pointer;
        }

        p{

            text-align:center;

            margin-top:20px;
        }

        a{

            color:#38bdf8;

            text-decoration:none;
        }

    </style>

</head>

<body>

    <div class="box">

        <h1>✨ Signup</h1>

        <form method="POST">

            <input type="text"
            name="username"
            placeholder="Create Username"
            required>

            <input type="password"
            name="password"
            placeholder="Create Password"
            required>

            <button type="submit">

                Signup 🚀

            </button>

        </form>

        <p>

            Already have account?

            <a href="/login">

                Login

            </a>

        </p>

    </div>

</body>

</html>
