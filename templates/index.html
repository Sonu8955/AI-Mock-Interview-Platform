<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Mock Interview</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{

            height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            background:
            linear-gradient(135deg,#020617,#0f172a,#111827);

            overflow:hidden;
        }

        .container{

            width:430px;

            padding:45px;

            border-radius:28px;

            background:#111827;

            border:1px solid #1e293b;

            box-shadow:
            0 0 40px rgba(0,0,0,0.5);

            text-align:center;

            color:white;

            animation:fadeIn 1s ease;
        }

        .robot{

            width:120px;
            height:120px;

            margin:auto;
            margin-bottom:25px;

            border-radius:50%;

            display:flex;
            justify-content:center;
            align-items:center;

            font-size:55px;

            background:
            linear-gradient(135deg,#06b6d4,#2563eb);

            box-shadow:
            0 0 35px rgba(37,99,235,0.5);

            animation:float 3s infinite ease-in-out;
        }

        h1{

            font-size:36px;

            margin-bottom:12px;

            color:#f8fafc;
        }

        p{

            color:#94a3b8;

            line-height:1.7;

            margin-bottom:30px;
        }

        select{

            width:100%;

            padding:15px;

            border:none;

            outline:none;

            border-radius:14px;

            background:#1e293b;

            color:white;

            font-size:16px;

            margin-bottom:25px;

            cursor:pointer;
        }

        button{

            width:100%;

            padding:15px;

            border:none;

            border-radius:14px;

            font-size:18px;

            font-weight:bold;

            cursor:pointer;

            color:white;

            background:
            linear-gradient(135deg,#2563eb,#06b6d4);

            transition:0.4s;

            box-shadow:
            0 0 25px rgba(37,99,235,0.4);
        }

        button:hover{

            transform:translateY(-3px) scale(1.02);

            box-shadow:
            0 0 40px rgba(6,182,212,0.6);
        }

        .footer{

            margin-top:25px;

            font-size:14px;

            color:#64748b;
        }

        @keyframes fadeIn{

            from{
                opacity:0;
                transform:translateY(30px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        @keyframes float{

            0%{
                transform:translateY(0px);
            }

            50%{
                transform:translateY(-10px);
            }

            100%{
                transform:translateY(0px);
            }
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="robot">
            🤖
        </div>

        <h1>AI Mock Interview</h1>

        <p>
            Practice AI-powered technical interviews
            and improve your confidence with
            real interview-style questions 
        </p>

        <form action="/interview" method="POST">

            <select name="role">

                <option>Python Developer</option>

                <option>Web Developer</option>

                <option>AI Engineer</option>

            </select>

            <button type="submit">

                Start Interview 

            </button>

        </form>

        <div class="footer">

            Designed by Sonu ✨

        </div>

    </div>

</body>

</html>
